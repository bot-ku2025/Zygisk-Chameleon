name: Build and Release Zygisk Chameleon Module

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build WebUI
        run: npm run build

      - name: Prepare Flashable Module Package
        run: |
          mkdir -p build_module/webroot
          cp -r dist/* build_module/webroot/
          
          # Copy module metadata and scripts from repository root
          for f in module.prop customize.sh service.sh post-fs-data.sh action.sh sepolicy.rule system.prop config.json README.md; do
            if [ -f "$f" ]; then
              cp "$f" build_module/
            fi
          done

          # Ensure shell scripts have execute permissions
          chmod 755 build_module/*.sh 2>/dev/null || true

          # Create flashable zip
          cd build_module
          TAG_VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          if [ "$TAG_VERSION" = "main" ] || [ -z "$TAG_VERSION" ]; then
            TAG_VERSION="v1.0.0"
          fi
          zip -r9 "../zygisk-chameleon-${TAG_VERSION}.zip" ./*
          cd ..

      - name: Upload Flashable Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zygisk-chameleon-flashable-zip
          path: zygisk-chameleon-*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: zygisk-chameleon-*.zip
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
